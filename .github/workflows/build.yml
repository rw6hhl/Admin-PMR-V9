name: Build adminPMR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Force AndroidX flag
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      # V12.5: Используем предустановленный Gradle 8.5 из кэша системы (обход Gradle 9.8.2)
      - name: Build Debug APK
        run: /opt/hostedtoolcache/gradle/8.5/x64/bin/gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Push APK to repository
        run: |
          mkdir -p apk
          rm -f apk/*.apk
          cp app/build/outputs/apk/debug/*.apk apk/
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f apk/*.apk
          git commit -m "Auto-update APK [skip ci]" || echo "No changes to commit"
          git push